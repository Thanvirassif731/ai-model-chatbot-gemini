<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #181825;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .chat-header {
      padding: 16px 24px;
      background: #313244;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #cba6f7;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #cba6f7;
      color: #1e1e2e;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #313244;
      color: #cdd6f4;
      border-bottom-left-radius: 4px;
    }

    .message.typing {
      color: #6c7086;
      font-style: italic;
    }

    .chat-input {
      display: flex;
      padding: 16px;
      gap: 10px;
      background: #1e1e2e;
      border-top: 1px solid #313244;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #45475a;
      background: #313244;
      color: #cdd6f4;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input input:focus {
      border-color: #cba6f7;
    }

    .chat-input button {
      padding: 12px 20px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .chat-input button:hover { background: #b48ead; }
    .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">✦ Gemini Chatbot</div>
    <div class="chat-messages" id="messages">
      <div class="message bot">Hi! I'm Gemini. How can I help you today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const messages = document.getElementById("messages");

    input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

    function appendMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;
      appendMessage(text, "user");

      const typing = appendMessage("Gemini is typing...", "bot typing");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.remove();
        appendMessage(data.reply || data.error, "bot");
      } catch {
        typing.remove();
        appendMessage("Something went wrong. Try again.", "bot");
      }

      sendBtn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
